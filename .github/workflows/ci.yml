name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  backend:
    name: Backend (miv-backend) - lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./miv-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./miv-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          PAYLOAD_SECRET: ci-placeholder-secret
          DATABASE_URI: mongodb://localhost:27017/payload-ci

      - name: Integration tests
        run: pnpm run test:int
        env:
          PAYLOAD_SECRET: ci-placeholder-secret
          DATABASE_URI: mongodb://localhost:27017/payload-ci

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

  frontend:
    name: Frontend (miv) - lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./miv
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ./miv/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432